# Predictive Sleep card for Mushroom (https://github.com/piitaya/lovelace-mushroom).
# Same entities as default.yaml; replace "sam" with the person's first name.
type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: Sam's sleep
    subtitle: >-
      {% if is_state('binary_sensor.sam_predictive_sleep_expected_asleep', 'on') %}Asleep
      {% elif is_state('binary_sensor.sam_predictive_sleep_wind_down', 'on') %}Winding down
      {% else %}Awake{% endif %}
  - type: custom:mushroom-chips-card
    chips:
      - type: entity
        entity: sensor.sam_predictive_sleep_confidence
        icon: mdi:chart-bell-curve
      - type: entity
        entity: sensor.sam_predictive_sleep_accuracy
        icon: mdi:target
      - type: entity
        entity: switch.sam_predictive_sleep_learning
        tap_action:
          action: toggle
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        primary: Next bedtime
        secondary: >-
          {% set t = states('sensor.sam_predictive_sleep_next_bedtime') | as_datetime(none) %}
          {{ as_local(t).strftime('%a %H:%M') if t else '—' }}
        icon: mdi:bed-clock
        icon_color: indigo
        entity: sensor.sam_predictive_sleep_next_bedtime
      - type: custom:mushroom-template-card
        primary: Next wake
        secondary: >-
          {% set t = states('sensor.sam_predictive_sleep_next_wake') | as_datetime(none) %}
          {{ as_local(t).strftime('%a %H:%M') if t else '—' }}
        icon: mdi:alarm
        icon_color: amber
        entity: sensor.sam_predictive_sleep_next_wake
  - type: custom:mushroom-entity-card
    entity: button.sam_predictive_sleep_forget_last_night
    name: Forget last night
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.sam_predictive_sleep_forget_last_night
      confirmation:
        text: Forget the last recorded night?
