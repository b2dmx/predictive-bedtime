# Predictive Sleep card, built-in cards only.
# Add a Manual card to a dashboard and paste this in, then replace "sam" with the
# person's first name as it appears in their entity IDs (e.g. sensor.sam_predictive_sleep_...).
type: vertical-stack
cards:
  - type: heading
    heading: Sam's sleep
    icon: mdi:sleep
    badges:
      - type: entity
        entity: binary_sensor.sam_predictive_sleep_expected_asleep
        show_state: true
      - type: entity
        entity: binary_sensor.sam_predictive_sleep_wind_down
        show_state: true
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: sensor.sam_predictive_sleep_next_bedtime
        name: Next bedtime
      - type: tile
        entity: sensor.sam_predictive_sleep_next_wake_up
        name: Next wake-up
      - type: tile
        entity: sensor.sam_predictive_sleep_prediction_confidence
        name: Prediction confidence
      - type: tile
        entity: sensor.sam_predictive_sleep_prediction_error
        name: Prediction error
      - type: tile
        entity: sensor.sam_predictive_sleep_previous_sleep_duration
        name: Previous sleep
      - type: tile
        entity: sensor.sam_predictive_sleep_previous_sleep
        name: Went to bed
      - type: tile
        entity: switch.sam_predictive_sleep_learning
        name: Learning
        features:
          - type: toggle
      - type: tile
        entity: button.sam_predictive_sleep_forget_previous_sleep
        name: Forget previous sleep
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.sam_predictive_sleep_forget_previous_sleep
          confirmation:
            text: Forget the previous recorded sleep?
  - type: history-graph
    title: Last 7 days
    hours_to_show: 168
    entities:
      - entity: binary_sensor.sam_predictive_sleep_expected_asleep
        name: Expected asleep
      - entity: binary_sensor.sam_predictive_sleep_wind_down
        name: Wind-down
